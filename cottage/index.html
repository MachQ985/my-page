<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>住宿对比</title>
<style>
  :root { --bg:#f6f4f0; --card:#fff; --ink:#1f2328; --mute:#6b7280; --line:#e7e3dc; --good:#15803d; --bad:#b91c1c; --accent:#c2410c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:24px 28px 8px; }
  h1 { margin:0 0 6px; font-size:26px; }
  .sub { color:var(--mute); font-size:14px; line-height:1.6; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; padding:10px 28px 0; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:13px; color:var(--mute); }
  .stat b { display:block; font-size:20px; color:var(--ink); }
  .picks { display:flex; gap:12px; flex-wrap:wrap; padding:12px 28px 4px; }
  .pick { background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:10px 14px; font-size:14px; }
  .pick b { color:var(--accent); }
  .legend { padding:8px 28px 0; font-size:13px; color:var(--mute); }
  .grid { display:grid; grid-template-columns:repeat(var(--cols,4), minmax(300px, 1fr)); gap:18px; padding:16px 28px 32px; }
  @media (max-width:1300px) { .grid { grid-template-columns:repeat(2, minmax(300px,1fr)); } }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  .region h2 { margin:0; font-size:19px; }
  .region .meta { color:var(--mute); font-size:13px; margin:2px 0 12px; min-height:34px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .photos { display:grid; grid-template-columns:2fr 1fr; grid-template-rows:repeat(2, minmax(0, 1fr)); gap:2px; height:190px; overflow:hidden; position:relative; background:#ddd; }
  .photos img { width:100%; height:100%; min-height:0; object-fit:cover; display:block; background:#ddd; }
  .photos img:first-child { grid-row:1 / 3; }
  .photos.n2 { grid-template-columns:1fr 1fr; grid-template-rows:minmax(0, 1fr); }
  .photos.n2 img:first-child, .photos.n1 img:first-child { grid-row:auto; }
  .photos.n1 { grid-template-columns:1fr; grid-template-rows:minmax(0, 1fr); }
  .rank { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.72); color:#fff; font-weight:700; border-radius:20px; padding:3px 10px; font-size:13px; }
  .body { padding:12px 14px 14px; }
  .name { font-weight:700; font-size:16px; line-height:1.3; }
  .row { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; }
  .price { font-size:20px; font-weight:700; }
  .pp { font-size:13px; color:var(--mute); font-weight:400; }
  .rating, .beds { font-size:13px; color:var(--mute); }
  .beds { margin-top:4px; }
  .feats { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 8px; }
  .feat { font-size:12px; padding:3px 8px; border-radius:20px; border:1px solid var(--line); }
  .feat.on { background:#ecfdf5; border-color:#a7f3d0; color:#065f46; }
  .feat.off { color:#9ca3af; text-decoration:line-through; }
  ul { margin:4px 0 0; padding-left:0; list-style:none; font-size:13px; line-height:1.55; }
  li.p::before { content:"✓ "; color:var(--good); font-weight:700; }
  li.c::before { content:"✗ "; color:var(--bad); font-weight:700; }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--mute); }
  .foot a { background:var(--ink); color:#fff; text-decoration:none; padding:6px 12px; border-radius:8px; font-size:13px; white-space:nowrap; }
  .bar { height:6px; background:#eee; border-radius:4px; margin-top:6px; overflow:hidden; }
  .bar span { display:block; height:100%; background:linear-gradient(90deg,#22c55e,#eab308,#ef4444); }
  footer { padding:0 28px 28px; font-size:12px; color:var(--mute); line-height:1.6; }
</style>
</head>
<body>

          <div class="bar"><span style="width:${Math.min(100, h.total / DATA.budgetTotal * 100)}%"></span></div>
          <div class="row"><span class="rating">⭐ ${esc(h.rating)}</span></div>

        </div>
      </div>`).join('')}
  </section>`).join('');
</script>
</body>
